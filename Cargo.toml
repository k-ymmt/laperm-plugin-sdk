[package]
name = "laperm-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "SDK for writing Laperm Plugins (WebAssembly core modules with one MessagePack host call)"
repository = "https://github.com/k-ymmt/laperm-plugin-sdk"
readme = "README.md"
keywords = ["laperm", "plugin", "wasm", "markdown"]
categories = ["wasm", "api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"

[dev-dependencies]
serde_json = "1"
